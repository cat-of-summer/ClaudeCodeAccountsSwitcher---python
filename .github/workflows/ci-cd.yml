name: ci/cd

on:
  push:
    branches: ['**']
    tags:
      - 'v*'
      - '**/v*'
  pull_request: {}
  workflow_dispatch:
    inputs:
      run_ci:
        description: 'Собирать и проверять (job ci)'
        required: false
        type: boolean
        default: true
      run_release:
        description: 'Создавать Release и публиковать в реестры (только на теге)'
        required: false
        type: boolean
        default: true
      run_cd:
        description: 'Деплоить (job cd)'
        required: false
        type: boolean
        default: true
      environment:
        description: 'Переопределить окружение (по умолчанию определяется автоматически)'
        required: false
        type: string
        default: ''
      runs_on:
        description: 'Переопределить RUNS_ON: ubuntu-latest,windows-latest'
        required: false
        type: string
        default: ''
      publish_method:
        description: 'Переопределить PUBLISH_METHOD'
        required: false
        type: choice
        options: ['', 'npm', 'docker', 'packagist']
        default: ''
      commits:
        description: 'Comma-separated commits to deploy'
        required: false
        type: string
        default: ''
      deploy_mirror:
        description: 'Keep all:false; delete files removed in commits:true; mirror sync (deletes untracked):full'
        required: false
        type: choice
        options: ['false', 'true', 'full']
        default: 'false'

permissions:
  contents: write
  packages: write

jobs:

  resolve-branch:
    runs-on: ubuntu-latest

    outputs:
      environment: ${{ steps.env.outputs.environment }}
      pkg_suffix: ${{ steps.env.outputs.pkg_suffix }}
      is_tag: ${{ steps.resolve.outputs.is_tag }}
      ref: ${{ steps.resolve.outputs.ref }}
      tag: ${{ steps.resolve.outputs.tag }}

    steps:
      - name: Resolve & validate tag
        id: resolve
        shell: bash
        env:
          MULTIPLE_PACKAGES: ${{ vars.MULTIPLE_PACKAGES }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ "$REF_TYPE" != "tag" ]; then
            echo "Ref '$REF_NAME' — не тег, релизная часть пайплайна не применяется."
            {
              echo "is_tag=false"
              echo "ref="
              echo "tag="
              echo "branch_explicit="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          FULL_TAG="$REF_NAME"
          if [[ "$FULL_TAG" == */* ]]; then
            BRANCH_EXPLICIT="${FULL_TAG%/*}"
            VER_TAG="${FULL_TAG##*/}"
          else
            BRANCH_EXPLICIT=""
            VER_TAG="$FULL_TAG"
          fi

          if [[ ! "$VER_TAG" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::Tag '$VER_TAG' is not a v-version tag (expected v#, v#.#, v#.#.#)." >&2
            exit 1
          fi

          if [ "${MULTIPLE_PACKAGES:-}" = "true" ]; then
            if [ -z "$BRANCH_EXPLICIT" ]; then
              echo "::error::MULTIPLE_PACKAGES=true: тег обязан быть в форме '{branch}/vX.Y.Z' (got '$FULL_TAG')." >&2
              exit 1
            fi
          else
            if [ -n "$BRANCH_EXPLICIT" ]; then
              echo "::error::MULTIPLE_PACKAGES выключен: тег обязан быть в форме 'vX.Y.Z' без префикса ветки (got '$FULL_TAG'). Включите MULTIPLE_PACKAGES=true для тегов '{branch}/vX.Y.Z'." >&2
              exit 1
            fi
          fi

          echo "Resolved tag: $FULL_TAG (version: $VER_TAG, branch: ${BRANCH_EXPLICIT:-auto})"
          {
            echo "is_tag=true"
            echo "ref=$FULL_TAG"
            echo "tag=$VER_TAG"
            echo "branch_explicit=$BRANCH_EXPLICIT"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: ${{ steps.resolve.outputs.is_tag == 'true' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.resolve.outputs.ref }}

      - name: Resolve environment
        id: env
        shell: bash
        env:
          MULTIPLE_PACKAGES: ${{ vars.MULTIPLE_PACKAGES }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ steps.resolve.outputs.is_tag }}
          FULL_TAG: ${{ steps.resolve.outputs.ref }}
          BRANCH_EXPLICIT: ${{ steps.resolve.outputs.branch_explicit }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -n "${INPUT_ENVIRONMENT:-}" ]; then
            REAL_BRANCH="$INPUT_ENVIRONMENT"
            echo "Environment переопределён входом workflow_dispatch."
          elif [ "$EVENT" = "pull_request" ]; then
            REAL_BRANCH="$BASE_REF"
          elif [ "$IS_TAG" = "true" ]; then
            if [ -n "$BRANCH_EXPLICIT" ]; then
              if ! git ls-remote --exit-code --heads origin "$BRANCH_EXPLICIT" >/dev/null 2>&1; then
                echo "::error::Branch '$BRANCH_EXPLICIT' from tag '$FULL_TAG' not found." >&2
                exit 1
              fi
              REAL_BRANCH="$BRANCH_EXPLICIT"
            else
              REAL_BRANCH=$(git branch -r --contains "$SHA" | grep -v HEAD | head -1 | sed 's#.*origin/##' | tr -d '[:space:]')
            fi
          else
            REAL_BRANCH="$REF_NAME"
          fi

          BRANCH="${REAL_BRANCH//\//-}"
          echo "Environment resolved to: '$BRANCH'"
          echo "environment=$BRANCH" >> "$GITHUB_OUTPUT"

          if [ "${MULTIPLE_PACKAGES:-}" = "true" ]; then
            echo "pkg_suffix=-${BRANCH}" >> "$GITHUB_OUTPUT"
          else
            echo "pkg_suffix=" >> "$GITHUB_OUTPUT"
          fi

  resolve-config:
    needs: resolve-branch
    runs-on: ubuntu-latest

    environment: ${{ needs.resolve-branch.outputs.environment }}

    outputs:
      run_ci: ${{ steps.decide.outputs.run_ci }}
      run_release: ${{ steps.decide.outputs.run_release }}
      run_cd: ${{ steps.decide.outputs.run_cd }}
      scope: ${{ steps.decide.outputs.scope }}
      commits: ${{ steps.decide.outputs.commits }}
      os_json: ${{ steps.decide.outputs.os_json }}
      publish_method: ${{ steps.decide.outputs.publish_method }}

    env:
      ACTION_TRIGGER: ${{ vars.ACTION_TRIGGER || 'WORKFLOW_DISPATCH' }}
      BUILD_COMMAND: ${{ vars.BUILD_COMMAND }}
      CI_COMMAND: ${{ vars.CI_COMMAND }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      DEPLOY_METHOD: ${{ vars.DEPLOY_METHOD || 'COMMAND' }}
      DEPLOY_LAST_COMMITS: ${{ vars.DEPLOY_LAST_COMMITS || 'false' }}

    steps:
      - name: Decide what to run
        id: decide
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          IS_TAG: ${{ needs.resolve-branch.outputs.is_tag }}
          INPUT_COMMITS: ${{ inputs.commits }}
          PUSH_COMMITS: ${{ join(github.event.commits.*.id, ',') }}
          INPUT_RUN_CI: ${{ inputs.run_ci }}
          INPUT_RUN_RELEASE: ${{ inputs.run_release }}
          INPUT_RUN_CD: ${{ inputs.run_cd }}
          RUNS_ON: ${{ inputs.runs_on || vars.RUNS_ON }}
          PUBLISH_METHOD: ${{ inputs.publish_method || vars.PUBLISH_METHOD }}
        run: |
          set -euo pipefail

          case "$ACTION_TRIGGER" in
            DISPATCH)
              echo "::warning::ACTION_TRIGGER=DISPATCH устарел — переименуйте значение в WORKFLOW_DISPATCH."
              ACTION_TRIGGER=WORKFLOW_DISPATCH
              ;;
            WORKFLOW_DISPATCH|PUSH|RELEASE) ;;
            *)
              echo "::error::Недопустимое ACTION_TRIGGER='$ACTION_TRIGGER'. Допустимо: WORKFLOW_DISPATCH | PUSH | RELEASE." >&2
              exit 1
              ;;
          esac

          PR=false
          ACTIVE=false
          case "$EVENT" in
            workflow_dispatch) ACTIVE=true ;;
            pull_request)      PR=true ;;
            push)
              if [ "$IS_TAG" = "true" ]; then
                case "$ACTION_TRIGGER" in PUSH|RELEASE) ACTIVE=true ;; esac
              else
                if [ "$ACTION_TRIGGER" = "PUSH" ]; then ACTIVE=true; fi
              fi
              ;;
          esac

          HAVE_CI=false
          if [ -n "${BUILD_COMMAND:-}" ] || [ -n "${CI_COMMAND:-}" ]; then HAVE_CI=true; fi

          HAVE_CD=false
          if [ -n "${DEPLOY_HOST:-}" ] && [ -n "${DEPLOY_USER:-}" ] && [ -n "${DEPLOY_KEY:-}" ] && [ -n "${DEPLOY_PATH:-}" ]; then
            HAVE_CD=true
          fi

          RUN_CI=false
          RUN_RELEASE=false
          RUN_CD=false
          if { [ "$PR" = "true" ] || [ "$ACTIVE" = "true" ]; } && [ "$HAVE_CI" = "true" ]; then RUN_CI=true; fi
          if [ "$ACTIVE" = "true" ] && [ "$IS_TAG" = "true" ]; then RUN_RELEASE=true; fi
          if [ "$ACTIVE" = "true" ] && [ "$PR" != "true" ] && [ "$HAVE_CD" = "true" ]; then RUN_CD=true; fi

          if [ "${INPUT_RUN_CI:-}" = "false" ];      then RUN_CI=false; fi
          if [ "${INPUT_RUN_RELEASE:-}" = "false" ]; then RUN_RELEASE=false; fi
          if [ "${INPUT_RUN_CD:-}" = "false" ];      then RUN_CD=false; fi

          SCOPE=""
          COMMITS=""
          if [ "$RUN_CD" = "true" ]; then
            if [ "$DEPLOY_METHOD" = "COMMAND" ]; then
              SCOPE="none"
            elif [ "$EVENT" = "workflow_dispatch" ]; then
              if [ -z "$INPUT_COMMITS" ]; then
                SCOPE="full"
              else
                SCOPE="selective"; COMMITS="$INPUT_COMMITS"
              fi
            elif [ "$EVENT" = "push" ] && [ "$IS_TAG" = "true" ]; then
              SCOPE="full"
            elif [ "$EVENT" = "push" ]; then
              if [ "$DEPLOY_LAST_COMMITS" = "true" ]; then
                SCOPE="selective"; COMMITS="$PUSH_COMMITS"
              else
                SCOPE="full"
              fi
            fi
          fi

          OS_LIST="${RUNS_ON:-}"
          if [ -z "$OS_LIST" ]; then OS_LIST="ubuntu-latest"; fi
          OS_JSON=$(printf '%s' "$OS_LIST" \
            | tr ',' '\n' \
            | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' \
            | grep -v '^$' \
            | sed 's/\\/\\\\/g; s/"/\\"/g; s/^/"/; s/$/"/' \
            | paste -sd, - || true)
          OS_JSON="[${OS_JSON}]"
          if [ "$OS_JSON" = "[]" ]; then
            echo "::error::RUNS_ON='$OS_LIST' не содержит ни одного runner'а." >&2
            exit 1
          fi

          case "${PUBLISH_METHOD:-}" in
            ''|npm|docker|packagist) ;;
            *) echo "::warning::Неизвестный PUBLISH_METHOD='$PUBLISH_METHOD' — публикация выполняться не будет. Допустимо: npm | docker | packagist." ;;
          esac

          echo "ACTION_TRIGGER=$ACTION_TRIGGER event=$EVENT is_tag=$IS_TAG active=$ACTIVE pr=$PR"
          echo "run_ci=$RUN_CI run_release=$RUN_RELEASE run_cd=$RUN_CD"
          echo "method=$DEPLOY_METHOD scope=$SCOPE os=$OS_JSON publish=${PUBLISH_METHOD:-<none>}"
          {
            echo "run_ci=$RUN_CI"
            echo "run_release=$RUN_RELEASE"
            echo "run_cd=$RUN_CD"
            echo "scope=$SCOPE"
            echo "commits=$COMMITS"
            echo "os_json=$OS_JSON"
            echo "publish_method=${PUBLISH_METHOD:-}"
          } >> "$GITHUB_OUTPUT"

  ci:
    needs: [resolve-branch, resolve-config]
    if: ${{ needs.resolve-config.outputs.run_ci == 'true' }}

    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.resolve-config.outputs.os_json) }}

    runs-on: ${{ matrix.os }}

    environment: ${{ needs.resolve-branch.outputs.environment }}

    permissions:
      contents: read

    env:
      BUILD_COMMAND: ${{ vars.BUILD_COMMAND }}
      CI_COMMAND: ${{ vars.CI_COMMAND }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-branch.outputs.is_tag == 'true' && needs.resolve-branch.outputs.ref || '' }}

      - name: Resolve toolchain
        id: tc
        shell: bash
        env:
          TOOLCHAIN: ${{ vars.TOOLCHAIN }}
        run: |
          set -euo pipefail
          tools=""
          while IFS= read -r item; do
            item="$(printf '%s' "$item" | tr -d '[:space:]')"
            if [ -z "$item" ]; then continue; fi
            name="${item%%[:@]*}"
            if [ "$name" = "$item" ]; then ver="latest"; else ver="${item#*[:@]}"; fi
            tools="$tools $name@$ver"
          done <<< "$(printf '%s' "${TOOLCHAIN:-}" | tr ',' '\n')"
          tools="${tools# }"

          if [ -z "$tools" ]; then
            echo "TOOLCHAIN не задан — установка инструментов пропускается."
          else
            echo "Инструменты: $tools"
          fi

          if [ -n "${MISE_DATA_DIR:-}" ]; then
            mise_dir="$MISE_DATA_DIR"
          elif [ -n "${XDG_DATA_HOME:-}" ]; then
            mise_dir="$XDG_DATA_HOME/mise"
          elif [ "$RUNNER_OS" = "Windows" ]; then
            mise_dir="$LOCALAPPDATA/mise"
          else
            mise_dir="$HOME/.local/share/mise"
          fi
          mise_dir="$(printf '%s' "$mise_dir" | tr '\\' '/')"

          {
            echo "tools=$tools"
            echo "mise_dir=$mise_dir"
          } >> "$GITHUB_OUTPUT"

      - name: Cache toolchain
        if: ${{ steps.tc.outputs.tools != '' }}
        uses: actions/cache@v4
        with:
          path: ${{ steps.tc.outputs.mise_dir }}
          key: mise-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.mise.toml', '.tool-versions') }}-${{ steps.tc.outputs.tools }}

      - name: Install toolchain
        if: ${{ steps.tc.outputs.tools != '' }}
        shell: bash
        env:
          TOOLS: ${{ steps.tc.outputs.tools }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          case "$RUNNER_OS" in
            Linux)   os=linux ;;
            macOS)   os=macos ;;
            Windows) os=windows ;;
            *) echo "::error::Неподдерживаемая ОС RUNNER_OS='$RUNNER_OS'." >&2; exit 1 ;;
          esac
          case "$RUNNER_ARCH" in
            X64)   arch=x64 ;;
            ARM64) arch=arm64 ;;
            *) echo "::error::Неподдерживаемая архитектура RUNNER_ARCH='$RUNNER_ARCH'." >&2; exit 1 ;;
          esac
          ext=""
          if [ "$os" = "windows" ]; then ext=".exe"; fi

          tmp="$RUNNER_TEMP"
          if command -v cygpath >/dev/null 2>&1; then tmp="$(cygpath -u "$RUNNER_TEMP")"; fi
          bin_dir="$tmp/mise-bin"
          mkdir -p "$bin_dir"
          mise="$bin_dir/mise${ext}"

          MISE_FALLBACK_VERSION="v2026.7.12"

          try_download() {
            echo "  пробую $1"
            curl -fsSL --retry 3 --retry-delay 2 -o "$mise" "$1" 2>/dev/null || return 1
            chmod +x "$mise" 2>/dev/null || true
            "$mise" --version >/dev/null 2>&1 || return 1
            return 0
          }

          release_url() {
            printf 'https://github.com/jdx/mise/releases/download/%s/mise-%s-%s-%s%s' "$1" "$1" "$os" "$arch" "$ext"
          }

          ok=false
          echo "Определяю версию mise…"
          if try_download "https://mise.jdx.dev/mise-latest-${os}-${arch}${ext}"; then
            ok=true
          else
            echo "::warning::CDN mise недоступен — пробую VERSION endpoint и GitHub API."
            ver=$(curl -fsSL --retry 2 https://mise.jdx.dev/VERSION 2>/dev/null | tr -d '[:space:]' || true)
            if [ -n "$ver" ]; then
              case "$ver" in v*) ;; *) ver="v$ver" ;; esac
              if try_download "$(release_url "$ver")"; then ok=true; fi
            fi
            if [ "$ok" != "true" ]; then
              api="https://api.github.com/repos/jdx/mise/releases/latest"
              if [ -n "${GH_TOKEN:-}" ]; then
                body=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "$api" 2>/dev/null || true)
              else
                body=$(curl -fsSL "$api" 2>/dev/null || true)
              fi
              ver=$(printf '%s' "$body" | grep -m1 '"tag_name"' | sed 's/.*"tag_name"[^"]*"\([^"]*\)".*/\1/' || true)
              if [ -n "$ver" ] && try_download "$(release_url "$ver")"; then ok=true; fi
            fi
            if [ "$ok" != "true" ]; then
              echo "::warning::Ни CDN, ни API не ответили — откатываюсь на вшитую рабочую версию $MISE_FALLBACK_VERSION."
              if try_download "$(release_url "$MISE_FALLBACK_VERSION")"; then ok=true; fi
            fi
          fi

          if [ "$ok" != "true" ]; then
            echo "::error::Не удалось скачать mise. Проверьте доступ runner'а к github.com и mise.jdx.dev." >&2
            exit 1
          fi
          echo "mise $("$mise" --version)"

          export MISE_YES=1 MISE_PYTHON_COMPILE=false
          "$mise" use --global $TOOLS
          "$mise" ls --installed

          {
            "$mise" bin-paths 2>/dev/null || true
            printf '%s\n%s\n' "${{ steps.tc.outputs.mise_dir }}/shims" "$bin_dir"
          } | while IFS= read -r p; do
            [ -z "$p" ] && continue
            if command -v cygpath >/dev/null 2>&1; then p="$(cygpath -w "$p")"; fi
            printf '%s\n' "$p" >> "$GITHUB_PATH"
          done

      - name: Build
        if: ${{ env.BUILD_COMMAND != '' }}
        shell: bash
        env:
          MATRIX_OS: ${{ matrix.os }}
        run: |
          set -euo pipefail
          eval "$BUILD_COMMAND"

      - name: Run CI command
        if: ${{ env.CI_COMMAND != '' }}
        shell: bash
        env:
          MATRIX_OS: ${{ matrix.os }}
        run: |
          set -euo pipefail
          eval "$CI_COMMAND"

      - name: Upload workspace
        uses: actions/upload-artifact@v4
        with:
          name: workspace-${{ matrix.os }}
          path: .
          if-no-files-found: error
          retention-days: 1

  release-publish:
    needs: [resolve-branch, resolve-config, ci]
    if: ${{ !failure() && !cancelled() && needs.resolve-config.outputs.run_release == 'true' }}
    runs-on: ubuntu-latest

    environment: ${{ needs.resolve-branch.outputs.environment }}

    env:
      RELEASE_FILES: ${{ vars.RELEASE_FILES }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-branch.outputs.ref }}

      - name: Download workspace from ci
        if: ${{ needs.resolve-config.outputs.run_ci == 'true' }}
        uses: actions/download-artifact@v4
        with:
          pattern: workspace-*
          merge-multiple: true
          path: .

      - name: Flatten release asset names
        id: stage
        if: ${{ env.RELEASE_FILES != '' }}
        shell: bash
        env:
          RUN_CI: ${{ needs.resolve-config.outputs.run_ci }}
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          out=".release-staging"
          rm -rf "$out"
          mkdir -p "$out"

          set -f
          patterns=( ${RELEASE_FILES//,/ } )
          set +f

          staged=()
          for pattern in "${patterns[@]}"; do
            base="${pattern%%[*?[{]*}"
            eval "matches=( $pattern )"
            for f in "${matches[@]}"; do
              [ -f "$f" ] || continue
              rel="${f#"$base"}"
              if [ -z "$rel" ] || [ "$rel" = "$f" ]; then
                rel="$(basename "$f")"
              fi
              flat="${rel//\//__}"
              cp "$f" "$out/$flat"
              staged+=("$out/$flat")
            done
          done
          if [ ${#staged[@]} -eq 0 ]; then
            echo "::error::No files matched RELEASE_FILES: $RELEASE_FILES" >&2
            if [ "$RUN_CI" != "true" ]; then
              echo "::error::Job 'ci' не запускался (run_ci=$RUN_CI), поэтому результатов сборки в дереве нет — файлы ищутся только среди закоммиченных." >&2
            fi
            exit 1
          fi
          printf 'Staged %s file(s):\n' "${#staged[@]}"
          printf '  %s\n' "${staged[@]}"
          {
            echo "files<<EOF"
            printf '%s\n' "${staged[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-branch.outputs.ref }}
          name: ${{ needs.resolve-branch.outputs.pkg_suffix != '' && format('{0} release {1}', needs.resolve-branch.outputs.environment, needs.resolve-branch.outputs.tag) || format('Release {0}', needs.resolve-branch.outputs.tag) }}
          generate_release_notes: true
          files: ${{ steps.stage.outputs.files }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npm-publish:
    needs: [resolve-branch, resolve-config, release-publish]
    if: ${{ !failure() && !cancelled() && needs.resolve-config.outputs.publish_method == 'npm' }}
    runs-on: ubuntu-latest

    environment: ${{ needs.resolve-branch.outputs.environment }}

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-branch.outputs.ref }}

      - name: Download workspace from ci
        if: ${{ needs.resolve-config.outputs.run_ci == 'true' }}
        uses: actions/download-artifact@v4
        with:
          pattern: workspace-*
          merge-multiple: true
          path: .

      - name: Resolve node version
        id: tc
        shell: bash
        env:
          TOOLCHAIN: ${{ vars.TOOLCHAIN }}
        run: |
          set -euo pipefail
          node=""
          while IFS= read -r it; do
            it="$(printf '%s' "$it" | tr -d '[:space:]')"
            if [ -z "$it" ]; then continue; fi
            name="${it%%[:@]*}"
            if [ "$name" = "$it" ]; then ver=""; else ver="${it#*[:@]}"; fi
            if [ "$name" = "node" ]; then
              if [ -n "$ver" ]; then node="$ver"; else node="lts/*"; fi
            fi
          done <<< "$(printf '%s' "${TOOLCHAIN:-}" | tr ',' '\n')"
          if [ -z "$node" ]; then
            node="lts/*"
            echo "::notice::TOOLCHAIN не задаёт node — для публикации берётся lts/*."
          fi
          echo "node=$node" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.tc.outputs.node }}

      - name: Drop committed .npmrc
        shell: bash
        run: |
          set -euo pipefail
          rm -f .npmrc

      - name: Set version from tag
        shell: bash
        env:
          TAG: ${{ needs.resolve-branch.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v([0-9]+(\.[0-9]+)*)$ ]]; then
            echo "::error::Tag '$TAG' is not a version tag (expected v#, v#.#, v#.#.#)." >&2
            exit 1
          fi
          NUM="${BASH_REMATCH[1]}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$NUM"
          VERSION="${MAJOR:-0}.${MINOR:-0}.${PATCH:-0}"
          echo "Tag $TAG -> package version $VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Apply per-branch package name
        if: ${{ needs.resolve-branch.outputs.pkg_suffix != '' }}
        shell: bash
        env:
          SUFFIX: ${{ needs.resolve-branch.outputs.pkg_suffix }}
        run: |
          set -euo pipefail
          NAME=$(node -p "require('./package.json').name")
          echo "MULTIPLE_PACKAGES: $NAME -> ${NAME}${SUFFIX}"
          npm pkg set name="${NAME}${SUFFIX}"

      - name: Setup Node for GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.tc.outputs.node }}
          registry-url: 'https://npm.pkg.github.com'
          scope: '@${{ github.repository_owner }}'

      - name: Publish to GitHub Packages
        id: gpr
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail
          if [ "$REPO_PRIVATE" = "true" ]; then ACCESS="restricted"; else ACCESS="public"; fi
          PKG=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          URL="https://npm.pkg.github.com"
          npm pkg delete publishConfig.registry >/dev/null 2>&1 || true
          if npm view "$PKG@$VERSION" version --registry "$URL" >/dev/null 2>&1; then
            echo "$PKG@$VERSION уже есть в GitHub Packages — пропускаем"
          else
            echo "npm publish --registry $URL --access $ACCESS"
            if ! npm publish --registry "$URL" --access "$ACCESS"; then
              echo "::group::npm debug log"
              cat "$(ls -t ~/.npm/_logs/*-debug-*.log 2>/dev/null | head -1)" 2>/dev/null || echo "(debug-лог не найден)"
              echo "::endgroup::"
              exit 1
            fi
          fi

      - name: Setup Node for npmjs.org
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.tc.outputs.node }}
          registry-url: 'https://registry.npmjs.org'
          scope: '@${{ github.repository_owner }}'

      - name: Ensure npm CLI supports trusted publishing
        shell: bash
        run: npm install -g npm@latest

      - name: Publish to npmjs.org
        id: npmjs
        continue-on-error: true
        shell: bash
        env:
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail
          if [ "$REPO_PRIVATE" = "true" ]; then ACCESS="restricted"; else ACCESS="public"; fi
          PKG=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          URL="https://registry.npmjs.org"
          if npm view "$PKG@$VERSION" version --registry "$URL" >/dev/null 2>&1; then
            echo "$PKG@$VERSION уже есть в npmjs.org — пропускаем"
          else
            echo "npm publish --registry $URL --access $ACCESS (trusted publishing / OIDC)"
            npm publish --registry "$URL" --access "$ACCESS"
          fi

  docker-publish:
    needs: [resolve-branch, resolve-config, release-publish]
    if: ${{ !failure() && !cancelled() && needs.resolve-config.outputs.publish_method == 'docker' }}
    runs-on: ubuntu-latest

    environment: ${{ needs.resolve-branch.outputs.environment }}

    env:
      DOCKER_REGISTRY: ${{ vars.DOCKER_REGISTRY || 'ghcr.io' }}
      DOCKER_IMAGE: ${{ vars.DOCKER_IMAGE || github.repository }}
      DOCKERFILE_PATH: ${{ vars.DOCKERFILE_PATH || './Dockerfile' }}
      BUILD_CONTEXT: ${{ vars.BUILD_CONTEXT || '.' }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-branch.outputs.ref }}

      - name: Download workspace from ci
        if: ${{ needs.resolve-config.outputs.run_ci == 'true' }}
        uses: actions/download-artifact@v4
        with:
          pattern: workspace-*
          merge-multiple: true
          path: ${{ vars.BUILD_CONTEXT || '.' }}

      - name: Validate Dockerfile
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$DOCKERFILE_PATH" ]; then
            echo "::error::Dockerfile not found at '$DOCKERFILE_PATH'. The docker publish method requires a Dockerfile (set DOCKERFILE_PATH to override the default ./Dockerfile)." >&2
            exit 1
          fi

      - name: Resolve image ref & version
        id: meta
        shell: bash
        env:
          SUFFIX: ${{ needs.resolve-branch.outputs.pkg_suffix }}
          BRANCH: ${{ needs.resolve-branch.outputs.environment }}
          TAG: ${{ needs.resolve-branch.outputs.tag }}
        run: |
          set -euo pipefail
          IMG="${DOCKER_IMAGE}${SUFFIX}"
          IMAGE="$(echo "${DOCKER_REGISTRY}/${IMG}" | tr '[:upper:]' '[:lower:]')"

          if [[ ! "$TAG" =~ ^v?([0-9]+(\.[0-9]+)*)$ ]]; then
            echo "::error::Tag '$TAG' is not a version tag (expected v#, v#.#, v#.#.#)." >&2
            exit 1
          fi
          VERSION="${BASH_REMATCH[1]}"

          echo "Image: $IMAGE"
          echo "Version: $VERSION"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

          {
            echo "tags<<EOF"
            echo "${IMAGE}:${VERSION}"
            echo "${IMAGE}:latest"
            if [ -z "$SUFFIX" ]; then
              echo "${IMAGE}:${BRANCH}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ vars.DOCKER_USERNAME || github.actor }}
          password: ${{ secrets.DOCKER_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ env.DOCKERFILE_PATH }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            GH_TOKEN=${{ secrets.PAT_TOKEN }}
            VERSION=${{ steps.meta.outputs.sha_short }}
            ENVIRONMENT=${{ needs.resolve-branch.outputs.environment }}
            ${{ vars.DOCKER_BUILD_ARGS }}

  packagist-publish:
    needs: [resolve-branch, resolve-config, release-publish]
    if: ${{ !failure() && !cancelled() && needs.resolve-config.outputs.publish_method == 'packagist' }}
    runs-on: ubuntu-latest

    environment: ${{ needs.resolve-branch.outputs.environment }}

    steps:
      - name: Publish to Packagist (update; create on first publish)
        shell: bash
        env:
          PACKAGIST_USERNAME: ${{ vars.PACKAGIST_USERNAME }}
          PACKAGIST_API_TOKEN: ${{ secrets.PACKAGIST_API_TOKEN }}
          REPO_URL: https://github.com/${{ github.repository }}
        run: |
          set -euo pipefail

          update_code=$(curl -sS -o /tmp/packagist.out -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_API_TOKEN}" \
            -d "{\"repository\":{\"url\":\"${REPO_URL}\"}}")

          if [ "$update_code" -ge 200 ] && [ "$update_code" -lt 300 ]; then
            echo "Packagist: пакет обновлён."
            cat /tmp/packagist.out; echo
            exit 0
          fi

          if [ "$update_code" != "404" ]; then
            echo "::error::Packagist update failed (HTTP $update_code)"
            cat /tmp/packagist.out; echo
            exit 1
          fi

          echo "Packagist: пакет не найден, создаю (первая публикация)…"
          create_code=$(curl -sS -o /tmp/packagist.out -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${PACKAGIST_USERNAME}:${PACKAGIST_API_TOKEN}" \
            https://packagist.org/api/create-package \
            -d "{\"repository\":\"${REPO_URL}\"}")

          if [ "$create_code" -ge 200 ] && [ "$create_code" -lt 300 ]; then
            echo "Packagist: пакет создан."
            cat /tmp/packagist.out; echo
          else
            echo "::error::Packagist create failed (HTTP $create_code) — нужен MAIN API-токен."
            cat /tmp/packagist.out; echo
            exit 1
          fi

  cd:
    needs: [resolve-branch, resolve-config, ci, release-publish, npm-publish, docker-publish, packagist-publish]
    if: ${{ !failure() && !cancelled() && needs.resolve-config.outputs.run_cd == 'true' }}
    runs-on: ubuntu-latest

    environment: ${{ needs.resolve-branch.outputs.environment }}

    permissions:
      contents: read

    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      DEPLOY_LOCAL_DIR: ${{ vars.DEPLOY_LOCAL_DIR || './' }}
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      DEPLOY_MIRROR: ${{ inputs.deploy_mirror || vars.DEPLOY_MIRROR || 'false' }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_METHOD: ${{ vars.DEPLOY_METHOD || 'COMMAND' }}
      BUILD_COMMAND: ${{ vars.BUILD_COMMAND }}
      BEFORE_DEPLOY_COMMAND: ${{ vars.BEFORE_DEPLOY_COMMAND }}
      AFTER_DEPLOY_COMMAND: ${{ vars.AFTER_DEPLOY_COMMAND }}
      SCOPE: ${{ needs.resolve-config.outputs.scope }}
      COMMITS: ${{ needs.resolve-config.outputs.commits }}
      RUN_CI: ${{ needs.resolve-config.outputs.run_ci }}

    steps:
      - name: Validate deploy mode
        shell: bash
        run: |
          set -euo pipefail
          if [ "$SCOPE" = "selective" ] && [ "$DEPLOY_METHOD" = "GIT" ]; then
            echo "::error::DEPLOY_METHOD=GIT is not supported in selective mode (workflow_dispatch with commits or DEPLOY_LAST_COMMITS=true). GIT deploys the whole branch, not a file subset."
            exit 1
          fi
          case "$DEPLOY_MIRROR" in
            false|true|full) ;;
            *) echo "::error::Invalid DEPLOY_MIRROR='$DEPLOY_MIRROR'. Allowed: false | true | full."; exit 1 ;;
          esac
          if [ "$SCOPE" = "selective" ] && [ "$DEPLOY_MIRROR" = "full" ]; then
            echo "::error::DEPLOY_MIRROR=full несовместим с выборочным деплоем (DEPLOY_LAST_COMMITS=true или workflow_dispatch с commits). 'full' — это точное зеркало всего дерева, а выборочный режим работает с подмножеством файлов. Для удаления файлов, убранных в задеплоенных коммитах, используйте DEPLOY_MIRROR=true."
            exit 1
          fi
          if [ "$SCOPE" = "selective" ] && [ "$RUN_CI" = "true" ]; then
            echo "::warning::SCOPE=selective — результаты сборки из job 'ci' не деплоятся: список файлов строится из git-истории, а собранные файлы в git отсутствуют. Для их деплоя нужен SCOPE=full."
          fi
          echo "Resolved: method=$DEPLOY_METHOD scope=$SCOPE mirror=$DEPLOY_MIRROR commits='$COMMITS'"

      - name: Setup SSH key
        if: ${{ env.DEPLOY_METHOD == 'RSYNC' || env.DEPLOY_METHOD == 'GIT' || env.DEPLOY_METHOD == 'COMMAND' }}
        shell: bash
        run: |
          TMP_KEY=$(mktemp)
          echo "$DEPLOY_KEY" > "$TMP_KEY"
          chmod 600 "$TMP_KEY"
          echo "TMP_KEY=$TMP_KEY" >> "$GITHUB_ENV"

      - name: Checkout
        if: ${{ env.SCOPE != 'none' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-branch.outputs.is_tag == 'true' && needs.resolve-branch.outputs.ref || github.ref_name }}
          fetch-depth: 0

      - name: Resolve REF_COMMIT
        if: ${{ env.SCOPE == 'selective' }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$COMMITS" ]; then
            REF_COMMIT=$(git rev-parse HEAD)
            echo "No commits specified — REF_COMMIT = HEAD = $REF_COMMIT"
          else
            readarray -t COMMITS_ARR < <(echo "$COMMITS" | tr ',; \t\r\n' '\n' | tr -s '\n' | grep -v '^[[:space:]]*$')
            REF_COMMIT=$(git log --no-walk --format='%ct %H' "${COMMITS_ARR[@]}" | sort -k1 -nr | head -1 | awk '{print $2}')
            echo "Resolved REF_COMMIT (latest by committer-date) = $REF_COMMIT"
          fi

          echo "REF_COMMIT=$REF_COMMIT" >> "$GITHUB_ENV"

          HEAD_COMMIT=$(git rev-parse HEAD)
          if [ "$REF_COMMIT" != "$HEAD_COMMIT" ]; then
            echo "Checking out REF_COMMIT (HEAD was $HEAD_COMMIT)"
            git checkout --force --detach "$REF_COMMIT"
          fi

      - name: Download workspace from ci
        if: ${{ env.SCOPE == 'full' && env.RUN_CI == 'true' }}
        uses: actions/download-artifact@v4
        with:
          pattern: workspace-*
          merge-multiple: true
          path: .

      - name: Resolve toolchain
        id: tc
        if: ${{ env.SCOPE == 'selective' && env.BUILD_COMMAND != '' }}
        shell: bash
        env:
          TOOLCHAIN: ${{ vars.TOOLCHAIN }}
        run: |
          set -euo pipefail
          tools=""
          while IFS= read -r item; do
            item="$(printf '%s' "$item" | tr -d '[:space:]')"
            if [ -z "$item" ]; then continue; fi
            name="${item%%[:@]*}"
            if [ "$name" = "$item" ]; then ver="latest"; else ver="${item#*[:@]}"; fi
            tools="$tools $name@$ver"
          done <<< "$(printf '%s' "${TOOLCHAIN:-}" | tr ',' '\n')"
          tools="${tools# }"
          echo "Инструменты: ${tools:-<нет>}"
          echo "tools=$tools" >> "$GITHUB_OUTPUT"

      - name: Install toolchain
        if: ${{ steps.tc.outputs.tools != '' }}
        shell: bash
        env:
          TOOLS: ${{ steps.tc.outputs.tools }}
        run: |
          set -euo pipefail

          MISE_FALLBACK_VERSION="v2026.7.12"
          bin_dir="$RUNNER_TEMP/mise-bin"
          mkdir -p "$bin_dir"
          mise="$bin_dir/mise"

          try_download() {
            curl -fsSL --retry 3 --retry-delay 2 -o "$mise" "$1" 2>/dev/null || return 1
            chmod +x "$mise" 2>/dev/null || true
            "$mise" --version >/dev/null 2>&1 || return 1
            return 0
          }
          release_url() {
            printf 'https://github.com/jdx/mise/releases/download/%s/mise-%s-linux-x64' "$1" "$1"
          }

          ok=false
          if try_download "https://mise.jdx.dev/mise-latest-linux-x64"; then
            ok=true
          else
            ver=$(curl -fsSL --retry 2 https://mise.jdx.dev/VERSION 2>/dev/null | tr -d '[:space:]' || true)
            if [ -n "$ver" ]; then
              case "$ver" in v*) ;; *) ver="v$ver" ;; esac
              if try_download "$(release_url "$ver")"; then ok=true; fi
            fi
            if [ "$ok" != "true" ]; then
              echo "::warning::CDN mise недоступен — откатываюсь на вшитую версию $MISE_FALLBACK_VERSION."
              if try_download "$(release_url "$MISE_FALLBACK_VERSION")"; then ok=true; fi
            fi
          fi

          if [ "$ok" != "true" ]; then
            echo "::error::Не удалось скачать mise. Проверьте доступ runner'а к github.com и mise.jdx.dev." >&2
            exit 1
          fi

          export MISE_YES=1 MISE_PYTHON_COMPILE=false
          "$mise" use --global $TOOLS
          "$mise" ls --installed
          {
            "$mise" bin-paths 2>/dev/null || true
            printf '%s\n%s\n' "$HOME/.local/share/mise/shims" "$bin_dir"
          } >> "$GITHUB_PATH"

      - name: Build
        if: ${{ env.SCOPE == 'selective' && env.BUILD_COMMAND != '' }}
        shell: bash
        run: |
          set -euo pipefail
          eval "$BUILD_COMMAND"

      - name: Cache lftp
        if: ${{ env.DEPLOY_METHOD == 'FTP' }}
        id: cache-lftp
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-lftp-v2

      - name: Keep apt packages for caching
        if: ${{ env.DEPLOY_METHOD == 'FTP' }}
        shell: bash
        run: echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/99keep-cache >/dev/null

      - name: Resolve changed files
        if: ${{ env.SCOPE == 'selective' }}
        shell: bash
        run: |
          set -euo pipefail

          UPLOAD_FILE="$RUNNER_TEMP/files_upload.txt"
          DELETE_FILE="$RUNNER_TEMP/files_delete.txt"
          ALL_FILES="$RUNNER_TEMP/all_files.txt"
          > "$UPLOAD_FILE"
          > "$DELETE_FILE"
          > "$ALL_FILES"

          LOCAL_DIR="${DEPLOY_LOCAL_DIR%/}"
          LOCAL_DIR="${LOCAL_DIR#./}"
          [ "$LOCAL_DIR" = "." ] && LOCAL_DIR=""

          if [ -z "$COMMITS" ]; then
            echo "=== Full deploy mode: collecting all paths ever touched in history ==="
            git log --pretty=format: --name-only | grep -v '^$' | sort -u > "$ALL_FILES" || true
          else
            readarray -t COMMITS_ARR < <(echo "$COMMITS" | tr ',; \t\r\n' '\n' | tr -s '\n' | grep -v '^[[:space:]]*$')
            for commit in "${COMMITS_ARR[@]}"; do
              commit="${commit// /}"
              [ -z "$commit" ] && continue
              echo "=== Processing commit: $commit ==="
              git diff-tree --no-commit-id -r --name-only "$commit" >> "$ALL_FILES"
            done
            sort -u -o "$ALL_FILES" "$ALL_FILES"
          fi

          echo "=== Candidate files: $(wc -l < "$ALL_FILES") ==="

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if [ -n "$LOCAL_DIR" ]; then
              [[ "$file" == "$LOCAL_DIR/"* ]] || continue
              rel="${file#"$LOCAL_DIR/"}"
            else
              rel="$file"
            fi

            if git cat-file -e "$REF_COMMIT:$file" 2>/dev/null; then
              echo "$rel" >> "$UPLOAD_FILE"
            else
              if [ "${DEPLOY_MIRROR}" = "true" ] || [ "${DEPLOY_MIRROR}" = "full" ]; then
                echo "$rel" >> "$DELETE_FILE"
              fi
            fi
          done < "$ALL_FILES"

          sort -u -o "$UPLOAD_FILE" "$UPLOAD_FILE"
          sort -u -o "$DELETE_FILE" "$DELETE_FILE"

          if ! [ -s "$UPLOAD_FILE" ] && ! [ -s "$DELETE_FILE" ]; then
            echo "::warning::No files match DEPLOY_LOCAL_DIR='${DEPLOY_LOCAL_DIR}'"
          fi

      - name: Strip .git* from deploy lists
        if: ${{ env.SCOPE == 'selective' }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$DEPLOY_MIRROR" = "false" ]; then
            PAT='^\.git'
          else
            PAT='^\.git(/|$)|^\.github(/|$)'
          fi

          for f in "$RUNNER_TEMP/files_upload.txt" "$RUNNER_TEMP/files_delete.txt"; do
            [ -s "$f" ] || continue
            grep -vE "$PAT" "$f" > "$f.tmp" || true
            mv "$f.tmp" "$f"
          done

          echo "--- Files to upload: $(wc -l < "$RUNNER_TEMP/files_upload.txt") ---"
          echo "--- Files to delete: $(wc -l < "$RUNNER_TEMP/files_delete.txt") ---"

      - name: Before deploy command
        if: ${{ env.BEFORE_DEPLOY_COMMAND != '' && env.DEPLOY_METHOD != 'FTP' }}
        shell: bash
        run: |
          set -euo pipefail

          ssh -i "$TMP_KEY" -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=30 -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "
            cd $DEPLOY_PATH
            $BEFORE_DEPLOY_COMMAND
          "

      - name: FTP deploy (full mirror)
        if: ${{ env.DEPLOY_METHOD == 'FTP' && env.SCOPE == 'full' }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ steps.cache-lftp.outputs.cache-hit }}" = "true" ] && ls /var/cache/apt/archives/lftp_*.deb &>/dev/null; then
            sudo dpkg -i /var/cache/apt/archives/lftp_*.deb || sudo apt-get install -f -y --no-install-recommends
          else
            sudo apt-get update -q
            sudo apt-get install -y --no-install-recommends lftp
          fi

          DELETE=""
          if [ "${DEPLOY_MIRROR}" = "full" ]; then
            DELETE="--delete"
          fi

          run_lftp_session() {
            local cmd_file="$1" max_retries="$2"
            {
              printf '%s\n' \
                "set net:timeout 30" \
                "set net:max-retries $max_retries" \
                "set net:reconnect-interval-base 5" \
                "set ftp:passive-mode true" \
                "set ssl:verify-certificate no" \
                "set ftp:list-options -a" \
                "set cmd:fail-exit true"
              cat "$cmd_file"
              echo "quit"
            } | lftp -u "$DEPLOY_USER,$DEPLOY_KEY" -p "$DEPLOY_PORT" "$DEPLOY_HOST"
          }

          run_lftp_single() {
            local cmd_file="$1" label="$2"
            local success=false
            for attempt in 1 2 3; do
              if run_lftp_session "$cmd_file" 1; then
                success=true
                break
              else
                echo "::warning::Per-file attempt $attempt/3 failed for '$label'"
              fi
            done
            if [ "$success" = "false" ]; then
              echo "::warning::Skipping '$label' after 3 failed attempts"
            fi
          }

          BATCH_CMD_FILE="$RUNNER_TEMP/lftp_batch_cmds.txt"
          BATCH_LOG="$RUNNER_TEMP/lftp_batch.log"

          if [ "$DEPLOY_MIRROR" = "false" ]; then
            GIT_EX="--exclude-glob '.git*'"
          else
            GIT_EX="--exclude-glob '.git' --exclude-glob '.github'"
          fi

          printf '%s\n' "mirror -R --no-perms --parallel=2 --verbose $GIT_EX $DELETE \"$DEPLOY_LOCAL_DIR\" \"$DEPLOY_PATH\"" > "$BATCH_CMD_FILE"

          echo "Attempting batch mirror..."
          batch_ok=false
          for attempt in 1 2 3; do
            if run_lftp_session "$BATCH_CMD_FILE" 5 >"$BATCH_LOG" 2>&1; then
              cat "$BATCH_LOG"
              echo "Batch mirror succeeded on attempt $attempt"
              batch_ok=true
              break
            else
              echo "::warning::Batch mirror attempt $attempt/3 failed. lftp output:"
              cat "$BATCH_LOG"
            fi
          done

          if [ "$batch_ok" = "false" ]; then
            echo "Falling back to per-file upload..."
            LOCAL_DIR="${DEPLOY_LOCAL_DIR%/}"
            LOCAL_DIR="${LOCAL_DIR#./}"
            [ "$LOCAL_DIR" = "." ] && LOCAL_DIR=""
            SRC_BASE="${LOCAL_DIR:-.}"

            SINGLE_CMD_FILE="$RUNNER_TEMP/lftp_single_cmd.txt"
            while IFS= read -r local_path; do
              rel_path="${local_path#./}"
              [ -n "$LOCAL_DIR" ] && rel_path="${rel_path#"$LOCAL_DIR/"}"
              file_dir=$(dirname "$rel_path")
              if [ "$file_dir" = "." ]; then
                remote_dir="$DEPLOY_PATH"
              else
                remote_dir="$DEPLOY_PATH/$file_dir"
              fi
              printf '%s\n' "mkdir -fp \"$remote_dir\"" "put -O \"$remote_dir\" \"$local_path\"" > "$SINGLE_CMD_FILE"
              run_lftp_single "$SINGLE_CMD_FILE" "$rel_path"
            done < <(
              if [ "$DEPLOY_MIRROR" = "false" ]; then
                find "$SRC_BASE" \( -name '.git' -o -name '.github' -o -name '.gitignore' -o -name '.gitattributes' -o -name '.gitmodules' \) -prune -o -type f -print
              else
                find "$SRC_BASE" \( -name '.git' -o -name '.github' \) -prune -o -type f -print
              fi
            )
          fi

      - name: FTP deploy (selective)
        if: ${{ env.DEPLOY_METHOD == 'FTP' && env.SCOPE == 'selective' }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ steps.cache-lftp.outputs.cache-hit }}" = "true" ] && ls /var/cache/apt/archives/lftp_*.deb &>/dev/null; then
            sudo dpkg -i /var/cache/apt/archives/lftp_*.deb || sudo apt-get install -f -y --no-install-recommends
          else
            sudo apt-get update -q
            sudo apt-get install -y --no-install-recommends lftp
          fi

          LOCAL_DIR="${DEPLOY_LOCAL_DIR%/}"
          LOCAL_DIR="${LOCAL_DIR#./}"
          [ "$LOCAL_DIR" = "." ] && LOCAL_DIR=""

          run_lftp_session() {
            local cmd_file="$1" max_retries="$2"
            {
              printf '%s\n' \
                "set net:timeout 30" \
                "set net:max-retries $max_retries" \
                "set net:reconnect-interval-base 5" \
                "set ftp:passive-mode true" \
                "set ssl:verify-certificate no" \
                "set ftp:list-options -a" \
                "set cmd:fail-exit true"
              cat "$cmd_file"
              echo "quit"
            } | lftp -u "$DEPLOY_USER,$DEPLOY_KEY" -p "$DEPLOY_PORT" "$DEPLOY_HOST"
          }

          run_lftp_single() {
            local cmd_file="$1" label="$2"
            local success=false
            for attempt in 1 2 3; do
              if run_lftp_session "$cmd_file" 1; then
                success=true
                break
              else
                echo "::warning::Per-file attempt $attempt/3 failed for '$label'"
              fi
            done
            if [ "$success" = "false" ]; then
              echo "::warning::Skipping '$label' after 3 failed attempts"
            fi
          }

          BATCH_CMD_FILE="$RUNNER_TEMP/lftp_batch_cmds.txt"
          BATCH_LOG="$RUNNER_TEMP/lftp_batch.log"

          UPLOAD_FILE="$RUNNER_TEMP/files_upload.txt"
          DELETE_FILE="$RUNNER_TEMP/files_delete.txt"

          if [ -s "$UPLOAD_FILE" ]; then
            > "$BATCH_CMD_FILE"
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              if [ -z "$LOCAL_DIR" ]; then
                src_path="./$file"
              else
                src_path="./$LOCAL_DIR/$file"
              fi
              file_dir=$(dirname "$file")
              if [ "$file_dir" = "." ]; then
                remote_dir="$DEPLOY_PATH"
              else
                remote_dir="$DEPLOY_PATH/$file_dir"
              fi
              echo "mkdir -fp \"$remote_dir\"" >> "$BATCH_CMD_FILE"
              echo "put -O \"$remote_dir\" \"$src_path\"" >> "$BATCH_CMD_FILE"
            done < "$UPLOAD_FILE"

            echo "Attempting batch upload..."
            batch_ok=false
            for attempt in 1 2 3; do
              if run_lftp_session "$BATCH_CMD_FILE" 5 >"$BATCH_LOG" 2>&1; then
                cat "$BATCH_LOG"
                echo "Batch upload succeeded on attempt $attempt"
                batch_ok=true
                break
              else
                echo "::warning::Batch upload attempt $attempt/3 failed. lftp output:"
                cat "$BATCH_LOG"
              fi
            done

            if [ "$batch_ok" = "false" ]; then
              echo "Falling back to per-file upload..."
              while IFS= read -r file; do
                [ -z "$file" ] && continue
                if [ -z "$LOCAL_DIR" ]; then
                  src_path="./$file"
                else
                  src_path="./$LOCAL_DIR/$file"
                fi
                file_dir=$(dirname "$file")
                if [ "$file_dir" = "." ]; then
                  remote_dir="$DEPLOY_PATH"
                else
                  remote_dir="$DEPLOY_PATH/$file_dir"
                fi
                SINGLE_CMD_FILE="$RUNNER_TEMP/lftp_single_cmd.txt"
                printf '%s\n' "mkdir -fp \"$remote_dir\"" "put -O \"$remote_dir\" \"$src_path\"" > "$SINGLE_CMD_FILE"
                run_lftp_single "$SINGLE_CMD_FILE" "$file"
              done < "$UPLOAD_FILE"
            fi
          fi

          if [ -s "$DELETE_FILE" ]; then
            > "$BATCH_CMD_FILE"
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              echo "rm -f \"$DEPLOY_PATH/$file\"" >> "$BATCH_CMD_FILE"
            done < "$DELETE_FILE"

            echo "Attempting batch delete..."
            batch_ok=false
            for attempt in 1 2 3; do
              if run_lftp_session "$BATCH_CMD_FILE" 5 >"$BATCH_LOG" 2>&1; then
                cat "$BATCH_LOG"
                echo "Batch delete succeeded on attempt $attempt"
                batch_ok=true
                break
              else
                echo "::warning::Batch delete attempt $attempt/3 failed. lftp output:"
                cat "$BATCH_LOG"
              fi
            done

            if [ "$batch_ok" = "false" ]; then
              echo "Falling back to per-file delete..."
              while IFS= read -r file; do
                [ -z "$file" ] && continue
                SINGLE_CMD_FILE="$RUNNER_TEMP/lftp_single_cmd.txt"
                printf '%s\n' "rm -f \"$DEPLOY_PATH/$file\"" > "$SINGLE_CMD_FILE"
                run_lftp_single "$SINGLE_CMD_FILE" "$file"
              done < "$DELETE_FILE"
            fi
          fi

      - name: RSYNC deploy (full)
        if: ${{ env.DEPLOY_METHOD == 'RSYNC' && env.SCOPE == 'full' }}
        shell: bash
        run: |
          set -euo pipefail

          DELETE=""
          if [ "${DEPLOY_MIRROR}" = "full" ]; then
            DELETE="--delete"
          fi

          attempt_rsync() {
            local rc
            for attempt in 1 2 3; do
              if rsync "$@"; then return 0; fi
              rc=$?
              echo "::warning::rsync attempt $attempt/3 failed (exit $rc); retrying in 5s..."
              sleep 5
            done
            echo "::error::rsync failed after 3 attempts (last exit $rc)"
            return 1
          }

          if [ "$DEPLOY_MIRROR" = "false" ]; then
            GIT_EX=(--exclude='/.git*')
          else
            GIT_EX=(--exclude='/.git' --exclude='/.github')
          fi

          attempt_rsync -avz --progress --timeout=30 $DELETE \
            -e "ssh -i $TMP_KEY -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=30 -p $DEPLOY_PORT" \
            "${GIT_EX[@]}" \
            --no-perms --no-owner --no-group \
            --omit-dir-times \
            --keep-dirlinks \
            "$DEPLOY_LOCAL_DIR/" "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH"

      - name: RSYNC deploy (selective)
        if: ${{ env.DEPLOY_METHOD == 'RSYNC' && env.SCOPE == 'selective' }}
        shell: bash
        run: |
          set -euo pipefail

          LOCAL_DIR="${DEPLOY_LOCAL_DIR%/}"
          LOCAL_DIR="${LOCAL_DIR#./}"
          [ "$LOCAL_DIR" = "." ] && LOCAL_DIR=""

          UPLOAD_FILE="$RUNNER_TEMP/files_upload.txt"
          DELETE_FILE="$RUNNER_TEMP/files_delete.txt"

          if [ -z "$LOCAL_DIR" ]; then
            SRC_DIR="./"
          else
            SRC_DIR="$LOCAL_DIR/"
          fi

          attempt_rsync() {
            local rc
            for attempt in 1 2 3; do
              if rsync "$@"; then return 0; fi
              rc=$?
              echo "::warning::rsync attempt $attempt/3 failed (exit $rc); retrying in 5s..."
              sleep 5
            done
            echo "::error::rsync failed after 3 attempts (last exit $rc)"
            return 1
          }

          if [ -s "$UPLOAD_FILE" ]; then
            attempt_rsync -avz --progress --timeout=30 \
              -e "ssh -i $TMP_KEY -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=30 -p $DEPLOY_PORT" \
              --files-from="$UPLOAD_FILE" \
              --ignore-missing-args \
              --no-perms --no-owner --no-group \
              --omit-dir-times \
              --keep-dirlinks \
              "$SRC_DIR" "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH"
          else
            echo "No files to upload."
          fi

          if { [ "${DEPLOY_MIRROR}" = "true" ] || [ "${DEPLOY_MIRROR}" = "full" ]; } && [ -s "$DELETE_FILE" ]; then
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              ssh -i "$TMP_KEY" \
                -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=30 -p "$DEPLOY_PORT" \
                "$DEPLOY_USER@$DEPLOY_HOST" "rm -f \"$DEPLOY_PATH/$file\""
            done < "$DELETE_FILE"
          fi

      - name: GIT deploy
        if: ${{ env.DEPLOY_METHOD == 'GIT' }}
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          ssh -i "$TMP_KEY" -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=30 -p $DEPLOY_PORT $DEPLOY_USER@$DEPLOY_HOST "
            cd $DEPLOY_PATH
            if [ ! -d '.git' ]; then
              git clone --branch ${GITHUB_REF_NAME} git@github.com:${GITHUB_REPOSITORY}.git .
            else
              if [ "${DEPLOY_MIRROR}" = "full" ]; then
                git fetch origin ${GITHUB_REF_NAME}
                git reset --hard origin/${GITHUB_REF_NAME}
              else
                git pull origin ${GITHUB_REF_NAME}
              fi
            fi
          "

      - name: After deploy command
        if: ${{ env.AFTER_DEPLOY_COMMAND != '' && env.DEPLOY_METHOD != 'FTP' }}
        shell: bash
        run: |
          set -euo pipefail

          ssh -i "$TMP_KEY" -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=30 -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "
            cd $DEPLOY_PATH
            $AFTER_DEPLOY_COMMAND
          "

      - name: Cleanup SSH key
        if: always()
        shell: bash
        run: |
          [ -n "${TMP_KEY:-}" ] && [ -f "$TMP_KEY" ] && rm -f "$TMP_KEY" || true
